name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.9"}  # no Python 3.9 build exists for newer Ubuntu images
          - {os: ubuntu-latest, python: "3.x"}
          - {os: macos-latest, python: "3.x"}
          - {os: windows-latest, python: "3.x"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests
        run: python -X dev -m unittest discover -s tests -v
      - name: Build the Claude Desktop extension
        run: python scripts/build_mcpb.py
